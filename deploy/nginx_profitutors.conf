# Конфигурация nginx. Куда положить на сервере:
#   /etc/nginx/sites-available/profitutors
#
# Затем включить:
#   sudo ln -s /etc/nginx/sites-available/profitutors /etc/nginx/sites-enabled/
#   sudo nginx -t          <- проверка конфига на ошибки
#   sudo systemctl reload nginx
#
# ВАЖНО: замените ВЕЗДЕ "your-domain.ru" на свой настоящий домен
# перед тем, как включать этот конфиг.
#
# SSL-блок (443) появится автоматически — его допишет certbot командой:
#   sudo certbot --nginx -d your-domain.ru -d www.your-domain.ru
# Не добавляйте его вручную, certbot сам вставит нужные строки в этот файл.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.ru www.your-domain.ru;

    # Максимальный размер загружаемого файла — должен совпадать
    # с MAX_CONTENT_LENGTH в app.py (сейчас там 10 МБ).
    client_max_body_size 10M;

    # Картинки, CSS, JS отдаём напрямую через nginx — быстрее, чем
    # пропускать через Python, и снижает нагрузку на сам сайт.
    location /static/ {
        alias /opt/profitutors/profischool_app/static/;
        expires 30d;
        access_log off;
    }

    # Всё остальное — в приложение на localhost:5000 (waitress).
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
