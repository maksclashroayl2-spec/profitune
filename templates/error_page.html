{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 560px;">

  <div class="display-1 fw-bold text-muted mb-3">{{ error_code }}</div>
  <h3 class="mb-2">{{ error_title }}</h3>
  <p class="text-muted mb-4">{{ error_message }}</p>

  <a href="{{ url_for('index') }}" class="btn btn-primary">На главную</a>

</div>
{% endblock %}
